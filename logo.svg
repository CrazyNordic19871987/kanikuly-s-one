<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#223348"/>
      <stop offset="100%" stop-color="#1B2838"/>
    </linearGradient>
    <linearGradient id="sun" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD93D"/>
      <stop offset="100%" stop-color="#E8A838"/>
    </linearGradient>
    <linearGradient id="palm" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a3a2a"/>
      <stop offset="100%" stop-color="#0d1f15"/>
    </linearGradient>
  </defs>
  <!-- background -->
  <rect width="400" height="400" rx="32" fill="url(#bg)"/>
  <!-- stars -->
  <circle cx="50" cy="60" r="2" fill="#fff" opacity="0.6"/>
  <circle cx="120" cy="40" r="1.5" fill="#fff" opacity="0.4"/>
  <circle cx="300" cy="55" r="2" fill="#fff" opacity="0.5"/>
  <circle cx="350" cy="80" r="1.5" fill="#fff" opacity="0.3"/>
  <circle cx="200" cy="30" r="1.8" fill="#fff" opacity="0.45"/>
  <circle cx="80" cy="90" r="1.2" fill="#fff" opacity="0.35"/>
  <circle cx="320" cy="35" r="1.3" fill="#fff" opacity="0.4"/>
  <!-- sun -->
  <circle cx="200" cy="140" r="55" fill="url(#sun)"/>
  <circle cx="200" cy="140" r="70" fill="none" stroke="#E8A838" stroke-width="1.5" opacity="0.3"/>
  <circle cx="200" cy="140" r="85" fill="none" stroke="#E8A838" stroke-width="1" opacity="0.15"/>
  <!-- sun rays -->
  <g stroke="#E8A838" stroke-width="2.5" stroke-linecap="round" opacity="0.5">
    <line x1="200" y1="50" x2="200" y2="35"/>
    <line x1="245" y1="62" x2="255" y2="50"/>
    <line x1="275" y1="95" x2="290" y2="85"/>
    <line x1="285" y1="140" x2="300" y2="140"/>
    <line x1="155" y1="62" x2="145" y2="50"/>
    <line x1="125" y1="95" x2="110" y2="85"/>
    <line x1="115" y1="140" x2="100" y2="140"/>
  </g>
  <!-- ocean wave -->
  <path d="M0 280 Q50 265 100 280 Q150 295 200 280 Q250 265 300 280 Q350 295 400 280 L400 400 L0 400 Z" fill="#0a1a30" opacity="0.6"/>
  <path d="M0 295 Q60 280 120 295 Q180 310 240 295 Q300 280 360 295 L400 290 L400 400 L0 400 Z" fill="#0d1f3a" opacity="0.5"/>
  <!-- palm tree left -->
  <g transform="translate(65, 180)">
    <rect x="-4" y="0" width="8" height="120" rx="3" fill="#2a1a0a"/>
    <ellipse cx="0" cy="-15" rx="45" ry="20" fill="url(#palm)" transform="rotate(-20)"/>
    <ellipse cx="0" cy="-20" rx="40" ry="18" fill="url(#palm)" transform="rotate(15)"/>
    <ellipse cx="5" cy="-25" rx="35" ry="16" fill="url(#palm)" transform="rotate(-5)"/>
  </g>
  <!-- palm tree right -->
  <g transform="translate(335, 190)">
    <rect x="-4" y="0" width="8" height="110" rx="3" fill="#2a1a0a"/>
    <ellipse cx="0" cy="-15" rx="42" ry="18" fill="url(#palm)" transform="rotate(20)"/>
    <ellipse cx="0" cy="-20" rx="38" ry="16" fill="url(#palm)" transform="rotate(-15)"/>
    <ellipse cx="-5" cy="-25" rx="33" ry="15" fill="url(#palm)" transform="rotate(5)"/>
  </g>
  <!-- tent center -->
  <polygon points="200,240 160,300 240,300" fill="#E8A838" opacity="0.9"/>
  <polygon points="200,240 170,300 200,295" fill="#d66a12" opacity="0.8"/>
  <line x1="200" y1="235" x2="200" y2="240" stroke="#FFD93D" stroke-width="3" stroke-linecap="round"/>
  <!-- campfire -->
  <g transform="translate(200, 310)">
    <line x1="-12" y1="0" x2="0" y2="-18" stroke="#5a3a1a" stroke-width="3" stroke-linecap="round"/>
    <line x1="12" y1="0" x2="0" y2="-18" stroke="#5a3a1a" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="0" cy="-22" rx="8" ry="12" fill="#E8A838" opacity="0.9"/>
    <ellipse cx="-2" cy="-26" rx="5" ry="8" fill="#FFD93D" opacity="0.8"/>
    <ellipse cx="1" cy="-30" rx="3" ry="5" fill="#fff" opacity="0.5"/>
  </g>
  <!-- text -->
  <text x="200" y="365" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="28" fill="#fff" letter-spacing="2">ONE!</text>
  <text x="200" y="388" text-anchor="middle" font-family="sans-serif" font-weight="400" font-size="12" fill="#E8A838" letter-spacing="4">SUMMER CAMP</text>
</svg>
